# Catálogo legal principal del Bot de Leyes de República Dominicana

proyecto:
  nombre: "Leyes-RD-Bot"
  descripcion: "Base legal dominicana para alimentar un bot jurídico con fuentes verificables."
  pais: "República Dominicana"
  alcance_inicial:
    - "Web"
    - "ChatGPT / GPT personalizado"
  excluido_por_ahora:
    - "Aplicación móvil"
    - "WhatsApp"
    - "Telegram"

reglas_generales:
  - "No inventar leyes, artículos, plazos, jurisprudencia ni procedimientos."
  - "Responder únicamente con base en documentos cargados en este repositorio o fuentes oficiales verificadas."
  - "Citar siempre ley, artículo, materia, archivo del repositorio y URL oficial cuando esté disponible."
  - "Si no existe fuente suficiente, indicar que no hay base legal suficiente en las fuentes cargadas."
  - "Distinguir entre orientación informativa y asesoría legal formal."

materias:
  - consumidor
  - civil
  - penal
  - inmobiliario
  - inquilinato
  - constitucional
  - administrativo
  - jurisprudencia
  - bancario
  - tributario
  - laboral
  - familia
  - transito

